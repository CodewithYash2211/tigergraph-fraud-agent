<text x="55" y="894" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52657a">Validation metrics are selection results; October is the frozen held-out evaluation.</text>
<text x="55" y="921" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52657a">AP means Average Precision, not trapezoidal precision–recall area.</text>
<text x="55" y="968" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657a">Source: backend/ml/results/validation_metrics.json; test_metrics.json; selection.json</text>
