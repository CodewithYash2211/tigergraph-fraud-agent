<text x="65" y="780" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172c43">Validation: 2,730 fraud / 106 cleared (96.26%)     Test: 3,065 fraud / 142 cleared (95.57%)</text>
<text x="65" y="809" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172c43">Fraud-heavy selection affects precision, F1 and AP; the ML score is not calibrated.</text>
