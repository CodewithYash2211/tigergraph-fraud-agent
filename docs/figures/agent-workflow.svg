<text x="1125.0" y="472.98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172c43">Shadow state / UI / local audit</text>
<text x="1125.0" y="501.98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172c43">Score excluded from policy inputs</text>
