<text x="1130.0" y="746.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">SIMULATED_UNAVAILABLE</text>
<text x="1130.0" y="773.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">simulated=true; response=UNKNOWN</text>
<polyline points="1130,661 1130,715" fill="none" stroke="#52657a" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="900" y="855" width="460" height="80" rx="10" fill="#f0f5fb" stroke="#24558a" stroke-width="1.8"/>
<text x="1130.0" y="888.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">Reassessment — iteration 2</text>
<text x="1130.0" y="915.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">Limit reached → final policy</text>
<polyline points="1130,791 1130,855" fill="none" stroke="#52657a" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="1130,935 1130,970 210,970 210,935" fill="none" stroke="#52657a" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="55,980 1385,980" fill="none" stroke="#52657a" stroke-width="2.2" stroke-linejoin="round"  />
<text x="55" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52657a">No actual customer response is generated. Initial/final recommendations and stopping reason are preserved.</text>
<text x="55" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52657a">The shadow call is a workflow step; its score is not passed into assessment or policy.</text>
<text x="55" y="1078" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657a">Source: backend/agent/workflow.py: investigate, evidence_route, simulate_response, build_workflow</text>
</svg>