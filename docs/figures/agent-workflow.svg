<rect x="65" y="625" width="710" height="64" rx="10" fill="#f0f5fb" stroke="#24558a" stroke-width="1.8"/>
<text x="420.0" y="664.14" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172c43">Initial policy</text>
