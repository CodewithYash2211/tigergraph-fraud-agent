<text x="615.0" y="887.98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172c43">Persistence</text>
<text x="615.0" y="916.98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172c43">Local JSON + ClosedCase</text>
<polyline points="365,895 455,895" fill="none" stroke="#52657a" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="900" y="585" width="460" height="76" rx="10" fill="#f0f5fb" stroke="#24558a" stroke-width="1.8"/>
<text x="1130.0" y="616.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">Evidence request</text>
<text x="1130.0" y="643.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#172c43">If insufficient + verification applicable</text>
